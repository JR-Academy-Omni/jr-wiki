name: Scraped Jobs Sync

# 由 daily-jobs routine 写 src/data/scraped-jobs/{DATE}.json + push 触发
# Push flat AI/Data/Product 岗位池到 jr-academy 后端（/admin-cms/jobs/scraped-jobs/bulk）

on:
  push:
    branches: [main]
    paths:
      - 'src/data/scraped-jobs/**/*.json'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date YYYY-MM-DD (optional, defaults to today AEST)'
        required: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ${{ fromJSON(vars.SERVICE_CI_RUNNER_LABELS) }}
    steps:
      - name: Require independent Mac CI
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true
          case "${RUNNER_NAME:-}" in lightman-mac-studio-*) ;; *) echo 'Service builds require the existing independent Mac CI' >&2; exit 1 ;; esac
          case "$(uname -s)" in
            Darwin) test "$(sysctl -n hw.model)" = Mac13,1 ;;
            Linux) test "$(uname -m)" = aarch64 ;;
            *) exit 1 ;;
          esac
          case "${BUILDKIT_HOST:-}" in ''|unix://*) ;; *) echo 'Remote BuildKit is forbidden' >&2; exit 1 ;; esac
          if command -v docker >/dev/null 2>&1; then
            endpoint="${DOCKER_HOST:-}"
            if [ -n "${DOCKER_CONTEXT:-}" ] || [ -z "$endpoint" ]; then
              endpoint=$(docker context inspect ${DOCKER_CONTEXT:+"$DOCKER_CONTEXT"} --format '{{.Endpoints.docker.Host}}')
            fi
            case "$endpoint" in unix://*|tcp://docker:2376) ;; *) echo 'Production/remote Docker is forbidden' >&2; exit 1 ;; esac
          fi
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Sync (push trigger — today's file)
        if: github.event_name == 'push'
        env:
          JR_SERVICE_API_KEY: ${{ secrets.JR_SERVICE_API_KEY }}
          JR_ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          JR_API: ${{ secrets.API_URL || 'https://api.jiangren.com.au' }}
        run: bun run scripts/sync-scraped-jobs.ts

      - name: Sync (manual dispatch — specific date)
        if: github.event_name == 'workflow_dispatch'
        env:
          JR_SERVICE_API_KEY: ${{ secrets.JR_SERVICE_API_KEY }}
          JR_ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          JR_API: ${{ secrets.API_URL || 'https://api.jiangren.com.au' }}
        run: bun run scripts/sync-scraped-jobs.ts ${{ inputs.date }}
