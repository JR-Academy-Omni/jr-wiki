name: Deploy jr-wiki

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ${{ fromJSON(vars.SERVICE_CI_RUNNER_LABELS) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require independent Mac CI
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true
          case "${RUNNER_NAME:-}" in lightman-mac-studio-*) ;; *) echo 'Service builds require the existing independent Mac CI' >&2; exit 1 ;; esac
          case "$(uname -s)" in
            Darwin) test "$(sysctl -n hw.model)" = Mac13,1 ;;
            Linux) test "$(uname -m)" = aarch64 ;;
            *) exit 1 ;;
          esac
          case "${BUILDKIT_HOST:-}" in ''|unix://*) ;; *) echo 'Remote BuildKit is forbidden' >&2; exit 1 ;; esac
          if command -v docker >/dev/null 2>&1; then
            endpoint="${DOCKER_HOST:-}"
            if [ -n "${DOCKER_CONTEXT:-}" ] || [ -z "$endpoint" ]; then
              endpoint=$(docker context inspect ${DOCKER_CONTEXT:+"$DOCKER_CONTEXT"} --format '{{.Endpoints.docker.Host}}')
            fi
            case "$endpoint" in unix://*|tcp://docker:2376) ;; *) echo 'Production/remote Docker is forbidden' >&2; exit 1 ;; esac
          fi
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Rebuild AI poster hub index
        run: node scripts/rebuild-ai-poster-index.mjs

      - name: Build
        run: bun run build.ts

      - name: Setup Chrome (for poster PNG rendering)
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Render AI news posters to PNG
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: bun run render:posters

      # Sync to MongoDB. continue-on-error so a sync failure doesn't block the
      # GitHub Pages deploy (sync uses ADMIN_TOKEN which expires every 30 days;
      # historically silently failed, now fails loudly via ::error:: annotations).
      # Switch to JR_SERVICE_API_KEY (long-lived) to avoid expiry.
      - name: Sync to MongoDB
        continue-on-error: true
        env:
          JR_SERVICE_API_KEY: ${{ secrets.JR_SERVICE_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_URL: https://api.jiangren.com.au
        run: bun run sync-to-db.ts

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
